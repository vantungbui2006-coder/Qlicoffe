<svg width="1000" height="960" viewBox="0 0 1000 960" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="1000" height="960" fill="#ffffff"/>

  <!-- ===== System boundary ===== -->
  <rect x="200" y="50" width="600" height="600" rx="16" fill="#fcfaf7" stroke="#333333" stroke-width="1.5"/>
  <text x="500" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#2c2c2a">HỆ THỐNG QUẢN LÝ ĐẶT HÀNG - COFFEE ORDER</text>

  <!-- ===== Actor: Khach hang ===== -->
  <g stroke="#2980b9" stroke-width="2" fill="none">
    <circle cx="90" cy="290" r="14" fill="#eaf3fb"/>
    <line x1="90" y1="304" x2="90" y2="350"/>
    <line x1="65" y1="320" x2="115" y2="320"/>
    <line x1="90" y1="350" x2="68" y2="388"/>
    <line x1="90" y1="350" x2="112" y2="388"/>
  </g>
  <text x="90" y="408" text-anchor="middle" font-size="13" font-weight="700" fill="#0c447c">Khách hàng</text>

  <!-- ===== Actor: Thu ngan ===== -->
  <g stroke="#c9822f" stroke-width="2" fill="none">
    <circle cx="910" cy="130" r="14" fill="#fdf1e4"/>
    <line x1="910" y1="144" x2="910" y2="190"/>
    <line x1="885" y1="160" x2="935" y2="160"/>
    <line x1="910" y1="190" x2="888" y2="228"/>
    <line x1="910" y1="190" x2="932" y2="228"/>
  </g>
  <text x="910" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#854f0b">Thu Ngân</text>

  <!-- ===== Actor: Pha che ===== -->
  <g stroke="#27ae60" stroke-width="2" fill="none">
    <circle cx="910" cy="450" r="14" fill="#eafaf1"/>
    <line x1="910" y1="464" x2="910" y2="510"/>
    <line x1="885" y1="480" x2="935" y2="480"/>
    <line x1="910" y1="510" x2="888" y2="548"/>
    <line x1="910" y1="510" x2="932" y2="548"/>
  </g>
  <text x="910" y="568" text-anchor="middle" font-size="13" font-weight="700" fill="#27500a">Pha Chế</text>

  <!-- ===== Association lines (draw first, under ellipses) ===== -->
  <g stroke="#2980b9" stroke-width="1" opacity="0.55">
    <line x1="104" y1="300" x2="230" y2="110"/>
    <line x1="104" y1="305" x2="230" y2="190"/>
    <line x1="104" y1="315" x2="230" y2="270"/>
    <line x1="104" y1="325" x2="230" y2="350"/>
  </g>
  <g stroke="#c9822f" stroke-width="1" opacity="0.55">
    <line x1="896" y1="140" x2="720" y2="110"/>
    <line x1="896" y1="150" x2="720" y2="180"/>
    <line x1="896" y1="160" x2="720" y2="250"/>
    <line x1="896" y1="170" x2="720" y2="320"/>
    <line x1="896" y1="180" x2="720" y2="390"/>
  </g>
  <g stroke="#27ae60" stroke-width="1" opacity="0.55">
    <line x1="896" y1="440" x2="720" y2="110"/>
    <line x1="896" y1="450" x2="720" y2="460"/>
    <line x1="896" y1="460" x2="720" y2="530"/>
    <line x1="896" y1="470" x2="720" y2="600"/>
  </g>

  <!-- ===== Use case ellipses: Khach hang (blue) ===== -->
  <g>
    <ellipse cx="330" cy="110" rx="100" ry="30" fill="#eaf3fb" stroke="#2980b9" stroke-width="1.2"/>
    <text x="330" y="105" text-anchor="middle" font-size="12.5" fill="#0c447c">Quét mã QR</text>
    <text x="330" y="121" text-anchor="middle" font-size="12.5" fill="#0c447c">nhận bàn</text>
  </g>
  <g>
    <ellipse cx="330" cy="190" rx="100" ry="30" fill="#eaf3fb" stroke="#2980b9" stroke-width="1.2"/>
    <text x="330" y="185" text-anchor="middle" font-size="12.5" fill="#0c447c">Xem thực đơn</text>
    <text x="330" y="201" text-anchor="middle" font-size="12.5" fill="#0c447c">&amp; giỏ hàng</text>
  </g>
  <g>
    <ellipse cx="330" cy="270" rx="100" ry="30" fill="#eaf3fb" stroke="#2980b9" stroke-width="1.2"/>
    <text x="330" y="275" text-anchor="middle" font-size="13" fill="#0c447c">Đặt hàng</text>
  </g>
  <g>
    <ellipse cx="330" cy="350" rx="100" ry="30" fill="#eaf3fb" stroke="#2980b9" stroke-width="1.2"/>
    <text x="330" y="345" text-anchor="middle" font-size="12.5" fill="#0c447c">Theo dõi trạng thái</text>
    <text x="330" y="361" text-anchor="middle" font-size="12.5" fill="#0c447c">đơn hàng</text>
  </g>

  <!-- ===== Use case: shared login (gray) ===== -->
  <g>
    <ellipse cx="620" cy="110" rx="100" ry="30" fill="#f4f4f2" stroke="#7f8c8d" stroke-width="1.2"/>
    <text x="620" y="105" text-anchor="middle" font-size="12.5" fill="#444441">Đăng nhập</text>
    <text x="620" y="121" text-anchor="middle" font-size="12.5" fill="#444441">hệ thống</text>
  </g>

  <!-- ===== Use case ellipses: Thu ngan (orange) ===== -->
  <g>
    <ellipse cx="620" cy="180" rx="100" ry="30" fill="#fdf1e4" stroke="#c9822f" stroke-width="1.2"/>
    <text x="620" y="175" text-anchor="middle" font-size="12.5" fill="#854f0b">Xem danh sách</text>
    <text x="620" y="191" text-anchor="middle" font-size="12.5" fill="#854f0b">đơn hàng</text>
  </g>
  <g>
    <ellipse cx="620" cy="250" rx="100" ry="30" fill="#fdf1e4" stroke="#c9822f" stroke-width="1.2"/>
    <text x="620" y="245" text-anchor="middle" font-size="12.5" fill="#854f0b">Xác nhận</text>
    <text x="620" y="261" text-anchor="middle" font-size="12.5" fill="#854f0b">đơn hàng</text>
  </g>
  <g>
    <ellipse cx="620" cy="320" rx="100" ry="30" fill="#fdf1e4" stroke="#c9822f" stroke-width="1.2"/>
    <text x="620" y="315" text-anchor="middle" font-size="12.5" fill="#854f0b">Thanh toán</text>
    <text x="620" y="331" text-anchor="middle" font-size="12.5" fill="#854f0b">đơn hàng</text>
  </g>
  <g>
    <ellipse cx="620" cy="390" rx="100" ry="30" fill="#fdf1e4" stroke="#c9822f" stroke-width="1.2"/>
    <text x="620" y="385" text-anchor="middle" font-size="12.5" fill="#854f0b">Chuyển đơn</text>
    <text x="620" y="401" text-anchor="middle" font-size="12.5" fill="#854f0b">cho pha chế</text>
  </g>

  <!-- ===== Use case ellipses: Pha che (green) ===== -->
  <g>
    <ellipse cx="620" cy="460" rx="100" ry="30" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
    <text x="620" y="455" text-anchor="middle" font-size="12.5" fill="#27500a">Xem hàng đợi</text>
    <text x="620" y="471" text-anchor="middle" font-size="12.5" fill="#27500a">pha chế</text>
  </g>
  <g>
    <ellipse cx="620" cy="530" rx="100" ry="30" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
    <text x="620" y="525" text-anchor="middle" font-size="12.5" fill="#27500a">Bắt đầu</text>
    <text x="620" y="541" text-anchor="middle" font-size="12.5" fill="#27500a">pha chế</text>
  </g>
  <g>
    <ellipse cx="620" cy="600" rx="100" ry="30" fill="#eafaf1" stroke="#27ae60" stroke-width="1.2"/>
    <text x="620" y="595" text-anchor="middle" font-size="12.5" fill="#27500a">Hoàn thành</text>
    <text x="620" y="611" text-anchor="middle" font-size="12.5" fill="#27500a">đơn hàng</text>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="12" fill="#444441">
    <rect x="220" y="600" width="14" height="14" fill="#eaf3fb" stroke="#2980b9"/>
    <text x="240" y="611">Khách hàng</text>
    <rect x="220" y="622" width="14" height="14" fill="#fdf1e4" stroke="#c9822f"/>
    <text x="240" y="633">Thu Ngân</text>
    <rect x="330" y="600" width="14" height="14" fill="#eafaf1" stroke="#27ae60"/>
    <text x="350" y="611">Pha Chế</text>
    <rect x="330" y="622" width="14" height="14" fill="#f4f4f2" stroke="#7f8c8d"/>
    <text x="350" y="633">Dùng chung</text>
  </g>

  <!-- ===== Data-flow section: Order lifecycle ===== -->
  <rect x="60" y="680" width="880" height="260" rx="12" fill="#fbf8f4" stroke="#c9822f" stroke-width="1"/>
  <text x="80" y="710" font-size="14" font-weight="700" fill="#4a2f18">LUỒNG DỮ LIỆU — ĐỐI TƯỢNG "Order" QUA TỪNG USE CASE</text>

  <g font-size="12.5" fill="#5a4634">
    <text x="80" y="740">1. Đặt hàng (Khách hàng)</text>
    <text x="420" y="740" fill="#0c447c">→ tạo mới Order { status: "cho_xac_nhan", items[], table, customer }</text>

    <text x="80" y="765">2. Xác nhận đơn hàng (Thu Ngân)</text>
    <text x="420" y="765" fill="#854f0b">→ cập nhật Order.status = "cho_thanh_toan"</text>

    <text x="80" y="790">3. Thanh toán đơn hàng (Thu Ngân)</text>
    <text x="420" y="790" fill="#854f0b">→ cập nhật Order.status = "da_thanh_toan", Order.paymentMethod</text>

    <text x="80" y="815">4. Chuyển đơn cho pha chế (Thu Ngân)</text>
    <text x="420" y="815" fill="#854f0b">→ cập nhật Order.status = "chuyen_bep"</text>

    <text x="80" y="840">5. Bắt đầu pha chế (Pha Chế)</text>
    <text x="420" y="840" fill="#27500a">→ cập nhật Order.status = "dang_pha_che"</text>

    <text x="80" y="865">6. Hoàn thành đơn hàng (Pha Chế)</text>
    <text x="420" y="865" fill="#27500a">→ cập nhật Order.status = "hoan_thanh"</text>

    <text x="80" y="890">7. Theo dõi trạng thái đơn (Khách hàng)</text>
    <text x="420" y="890" fill="#0c447c">→ chỉ đọc (read-only) Order.status theo thời gian thực</text>
  </g>
  <text x="80" y="920" font-size="11.5" fill="#8a7565" font-style="italic">Ghi chú: mọi thao tác đọc/ghi hiện đi qua lớp mock-data.js (localStorage) — khi thay backend thật, chỉ đổi cách hàm getOrders()/updateOrder() truy xuất dữ liệu, luồng use case và trạng thái Order giữ nguyên.</text>
</svg>
